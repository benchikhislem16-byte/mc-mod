# Gradle & JVM properties. Minecraft 26.3 requires Java 25.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric properties for Minecraft 26.3 (unobfuscated: Mojang names, no remapping).
# Pins taken from the official FabricMC 26.3 example mod (branch 26.3) and the
# fabric-api / fabric-loom / fabric tags on GitHub. Loom 1.19.3 is the newest stable
# Loom tag; the official example uses 1.19-SNAPSHOT, which is not used here.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.2+26.3

# Mod properties
mod_version=1.0.0+mc26.3
maven_group=dev.wildernesscull
archives_base_name=wilderness-cull
